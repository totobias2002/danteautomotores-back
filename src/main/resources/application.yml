server:
  port: ${PORT:8080}
  tomcat:
    # Cuánto de un upload rechazado (por pasarse de max-file-size) Tomcat sigue leyendo para poder contestar
    # el 413 en vez de cortar la conexión. Acotado a propósito: nunca -1 (ilimitado).
    max-swallow-size: 50MB

spring:
  application:
    name: danteautomotores-back
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/danteautomotores}
    username: ${SPRING_DATASOURCE_USERNAME:dante}
    password: ${SPRING_DATASOURCE_PASSWORD:dante_dev_password}
  jpa:
    # Las lecturas lazy (agencia, fotos) las cubre el @Transactional de cada service, no una sesión abierta
    # durante toda la request.
    open-in-view: false
    hibernate:
      # El esquema vive en db/migration (Flyway); Hibernate solo lo valida. Un cambio de entidad sin su migracion
      # aborta el arranque a proposito: es mejor que fallar en produccion con una columna que no existe.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Carga en lote la agencia y las fotos al mapear listas (evita el N+1 en el catalogo).
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    # baseline-on-migrate solo actua sobre un esquema no vacio sin flyway_schema_history (la base de produccion creada
    # por Hibernate): la marca como V1 (el esquema previo a la Fase 1) sin ejecutarla y aplica solo V2 en adelante.
    # Despues del primer deploy se puede apagar con SPRING_FLYWAY_BASELINE_ON_MIGRATE=false.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      # Una foto pesa hasta 10 MB; max-request-size deja un margen para el resto de las partes del multipart.
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  catalogo:
    # Cuantos dias sigue visible en el catalogo un auto despues de pasar a VENDIDO.
    dias-vendido-visible: ${APP_CATALOGO_DIAS_VENDIDO_VISIBLE:30}
  jwt:
    secret: ${APP_JWT_SECRET:CAMBIAR_ESTE_SECRETO_POR_UNO_PROPIO_DE_AL_MENOS_32_CARACTERES}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24hs
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Cuenta admin sembrada al arrancar si no existe ninguna (ver DataSeeder)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nombre: ${ADMIN_NOMBRE:}
  # Origen del front (con https, sin barra final y uno de los de app.cors.allowed-origins): los links de los mails se
  # arman con este valor y nunca con el Host de la request. Fuera del modo desarrollo SecretosGuard exige https y no localhost.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  # Sin BREVO_API_KEY los mails NO se mandan: solo se escriben en el log (desarrollo y tests). Fuera del modo
  # desarrollo SecretosGuard exige BREVO_API_KEY y MAIL_REMITENTE_EMAIL; nunca poner credenciales en este archivo.
  mail:
    remitente-email: ${MAIL_REMITENTE_EMAIL:}
    remitente-nombre: ${MAIL_REMITENTE_NOMBRE:Dante Automotores}
    responder-a: ${MAIL_RESPONDER_A:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      api-url: ${BREVO_API_URL:https://api.brevo.com}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  seguridad:
    confirmacion-email-horas: 24
    restablecer-contrasena-minutos: 60
    # El plan gratis de Brevo permite 300 mails por dia en total: se deja margen.
    mails-por-dia: 250

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
