server:
  port: 8080

spring:
  application:
    name: danteautomotores-back
  datasource:
    url: jdbc:postgresql://localhost:5432/danteautomotores
    username: dante
    password: dante_dev_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: "CAMBIAR_ESTE_SECRETO_POR_UNO_PROPIO_DE_AL_MENOS_32_CARACTERES"
    expiration-ms: 86400000 # 24hs
  cors:
    allowed-origins: "http://localhost:5173"

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
